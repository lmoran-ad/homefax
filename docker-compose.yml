services:
  postgres:
    image: postgres:16
    container_name: homefax-postgres
    environment:
      POSTGRES_DB: homefax
      POSTGRES_USER: homefax
      POSTGRES_PASSWORD: homefax
    ports:
      - "5432:5432"
    volumes:
      - homefax_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homefax -d homefax"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  homefax_postgres:
